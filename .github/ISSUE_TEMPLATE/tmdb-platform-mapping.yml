name: TMDB 平台映射
description: 提交一部电影或剧集，由映射 agent 搜索 TMDB 与视频平台并生成映射
title: "[TMDB Mapping] "
labels:
  - tmdb-mapping
assignees:
  - baranwang
body:
  - type: markdown
    attributes:
      value: |
        只填标题即可。映射 agent 会自行搜索 TMDB 条目、季号和视频平台链接。
        已经知道的链接或季号可以选填，用来缩小范围；留空不会挡住处理。

  - type: input
    id: media_title
    attributes:
      label: 媒体标题
      description: 电影或剧集标题。自动化会据此搜索 TMDB 和平台。
      placeholder: 例如：嫁金钗
    validations:
      required: true

  - type: input
    id: tmdb_url
    attributes:
      label: TMDB 链接（可选）
      description: 已知时填写。留空则由 agent 搜索。
      placeholder: https://www.themoviedb.org/movie/980477 或 https://www.themoviedb.org/tv/30983
    validations:
      required: false

  - type: input
    id: season
    attributes:
      label: 季号（可选）
      description: 多季剧需要指定某一季时填写。留空则由 agent 判断，单季剧通常按 series 处理。
      placeholder: 例如：1
    validations:
      required: false

  - type: textarea
    id: platform_urls
    attributes:
      label: 视频平台链接（可选）
      description: 已知时每行一个 URL。留空则由 agent 搜索。
      placeholder: |
        https://v.qq.com/x/cover/mzc00200a1b2c3d.html
        https://www.iqiyi.com/v_19rr8p9q4k.html
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 备注（可选）
      description: 版本、地区或其它需要缩小范围的说明。
      placeholder: 例如：只要优酷正片。
    validations:
      required: false
